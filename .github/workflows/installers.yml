name: Build HTTPS Android installer

on:
  workflow_dispatch:
  push:
    branches: ['codex/installer-candidate']

permissions:
  contents: read
concurrency:
  group: khotwa-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_BASE_URL: https://khotwa-api-staging-p4le.onrender.com
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Set one increasing distribution version for all architectures
        run: echo "BUILD_NUMBER=$((10000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Verify reachable HTTPS database readiness
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(os.environ['API_BASE_URL'] + '/health', timeout=90) as response:
              assert response.status == 200
              assert json.load(response)['database'] == 'ready'
          PY
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Load private Android distribution identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KHOTWA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KHOTWA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHOTWA_ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS'):
              if not os.environ.get(name):
                  raise SystemExit('Android distribution signing is not configured')
          path = Path(os.environ['RUNNER_TEMP']) / 'khotwa-distribution.p12'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('KHOTWA_ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build signed Android release APK
        env:
          KHOTWA_ANDROID_STORE_PASSWORD: ${{ secrets.KHOTWA_ANDROID_STORE_PASSWORD }}
          KHOTWA_ANDROID_KEY_PASSWORD: ${{ secrets.KHOTWA_ANDROID_STORE_PASSWORD }}
          KHOTWA_ANDROID_KEY_ALIAS: ${{ secrets.KHOTWA_ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release --no-pub --split-per-abi --build-number="$BUILD_NUMBER" --dart-define="API_BASE_URL=$API_BASE_URL"
          flutter build apk --release --no-pub --build-number="$BUILD_NUMBER" --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Verify signatures, ABI contents, and release metadata
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p build/installers
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            input="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [[ "$abi" == universal ]]; then input="build/app/outputs/flutter-apk/app-release.apk"; fi
            cp "$input" "build/installers/Khotwa-$abi.apk"
            "$tools/apksigner" verify --verbose --print-certs "$input" > "build/installers/SIGNATURE-$abi.txt"
            "$tools/aapt" dump badging "$input" > "build/installers/PACKAGE-$abi.txt"
          done
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          output = Path('build/installers')
          files = []
          supported = {'arm64-v8a', 'armeabi-v7a', 'x86_64'}
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64', 'universal'):
              path = output / f'Khotwa-{abi}.apk'
              expected_abis = supported if abi == 'universal' else {abi}
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None
                  actual_abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
                  assert actual_abis == expected_abis, (abi, actual_abis)
                  for architecture in expected_abis:
                      assert f'lib/{architecture}/libapp.so' in apk.namelist()
                      assert f'lib/{architecture}/libflutter.so' in apk.namelist()
                  assert 'AndroidManifest.xml' in apk.namelist()
              package = (output / f'PACKAGE-{abi}.txt').read_text()
              version = int(re.search(r"versionCode='(\d+)'", package)[1])
              minimum = int(re.search(r"sdkVersion:'(\d+)'", package)[1])
              assert version == int(os.environ['BUILD_NUMBER']) and version > 4004
              assert "name='org.khotwa.khotwa'" in package
              signature = (output / f'SIGNATURE-{abi}.txt').read_text()
              assert 'Verifies' in signature and '9235d22df8c6e12a3cbddc2e18aec1ab3e9c2b1abad8f54ee77c19194c03dd41' in signature
              files.append({'file': path.name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'abi': abi,
                            'supported_abis': sorted(expected_abis), 'version_code': version, 'min_sdk': minimum})
          (output / 'BUILD_METADATA.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'api_base_url': os.environ['API_BASE_URL'], 'android_signed': True,
              'synthetic_data_only': True, 'physical_device_tested': False,
              'mvp_accepted': False, 'files': files,
          }, indent=2) + '\n')
          (output / 'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['file']}\n" for item in files))
          PY
      - name: Remove temporary signing identity
        if: always()
        run: |
          if [[ -n "${KHOTWA_ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$KHOTWA_ANDROID_KEYSTORE_PATH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-android-https-arm64-${{ github.sha }}
          path: |
            mobile/build/installers/Khotwa-arm64-v8a.apk
            mobile/build/installers/SIGNATURE-arm64-v8a.txt
            mobile/build/installers/PACKAGE-arm64-v8a.txt
            mobile/build/installers/BUILD_METADATA.json
            mobile/build/installers/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-android-https-universal-${{ github.sha }}
          path: |
            mobile/build/installers/Khotwa-universal.apk
            mobile/build/installers/SIGNATURE-universal.txt
            mobile/build/installers/PACKAGE-universal.txt
            mobile/build/installers/BUILD_METADATA.json
            mobile/build/installers/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-android-https-arm32-${{ github.sha }}
          path: |
            mobile/build/installers/Khotwa-armeabi-v7a.apk
            mobile/build/installers/SIGNATURE-armeabi-v7a.txt
            mobile/build/installers/PACKAGE-armeabi-v7a.txt
            mobile/build/installers/BUILD_METADATA.json
            mobile/build/installers/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-android-https-x86_64-${{ github.sha }}
          path: |
            mobile/build/installers/Khotwa-x86_64.apk
            mobile/build/installers/SIGNATURE-x86_64.txt
            mobile/build/installers/PACKAGE-x86_64.txt
            mobile/build/installers/BUILD_METADATA.json
            mobile/build/installers/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
