name: Build HTTPS Android installer

on:
  workflow_dispatch:
  push:
    branches: ['codex/installer-candidate']

permissions:
  contents: read
concurrency:
  group: khotwa-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_BASE_URL: https://khotwa-api-staging-p4le.onrender.com
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify reachable HTTPS database readiness
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(os.environ['API_BASE_URL'] + '/health', timeout=90) as response:
              assert response.status == 200
              assert json.load(response)['database'] == 'ready'
          PY
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Load private Android distribution identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KHOTWA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KHOTWA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHOTWA_ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS'):
              if not os.environ.get(name):
                  raise SystemExit('Android distribution signing is not configured')
          path = Path(os.environ['RUNNER_TEMP']) / 'khotwa-distribution.p12'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('KHOTWA_ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build signed Android release APK
        env:
          KHOTWA_ANDROID_STORE_PASSWORD: ${{ secrets.KHOTWA_ANDROID_STORE_PASSWORD }}
          KHOTWA_ANDROID_KEY_PASSWORD: ${{ secrets.KHOTWA_ANDROID_STORE_PASSWORD }}
          KHOTWA_ANDROID_KEY_ALIAS: ${{ secrets.KHOTWA_ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --no-pub --split-per-abi --build-number="${{ github.run_number }}" --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Verify signatures, ABI contents, and release metadata
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p build/installers
          for abi in arm64-v8a armeabi-v7a x86_64; do
            input="build/app/outputs/flutter-apk/app-$abi-release.apk"
            cp "$input" "build/installers/Khotwa-$abi.apk"
            "$tools/apksigner" verify --verbose --print-certs "$input" > "build/installers/SIGNATURE-$abi.txt"
            "$tools/aapt" dump badging "$input" > "build/installers/PACKAGE-$abi.txt"
          done
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          output = Path('build/installers')
          files = []
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              path = output / f'Khotwa-{abi}.apk'
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None
                  assert f'lib/{abi}/libapp.so' in apk.namelist()
                  assert 'AndroidManifest.xml' in apk.namelist()
              files.append({'file': path.name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'abi': abi})
          (output / 'BUILD_METADATA.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'api_base_url': os.environ['API_BASE_URL'], 'android_signed': True,
              'synthetic_data_only': True, 'physical_device_tested': False,
              'mvp_accepted': False, 'files': files,
          }, indent=2) + '\n')
          (output / 'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['file']}\n" for item in files))
          PY
      - name: Remove temporary signing identity
        if: always()
        run: |
          if [[ -n "${KHOTWA_ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$KHOTWA_ANDROID_KEYSTORE_PATH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-android-https-installers-${{ github.sha }}
          path: mobile/build/installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
