name: Prepare verified Android update delta

on:
  push:
    branches: ['codex/installer-delta']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            key: arm64
          - abi: x86_64
            key: x86_64
    env:
      ABI: ${{ matrix.abi }}
      BASE_COMMIT: 9f38187afdf6511138ccbac34fad1155c89695a7
      TARGET_COMMIT: 9cee95c99fe4c5ad39432970821b1e3c7877f3e1
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43570392325
          name: khotwa-android-https-${{ matrix.key }}-9f38187afdf6511138ccbac34fad1155c89695a7
          path: base
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43575067820
          name: khotwa-android-https-${{ matrix.key }}-9cee95c99fe4c5ad39432970821b1e3c7877f3e1
          path: target
      - name: Install standard binary-diff utility on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff
      - name: Verify both signed installer inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path
          abi = os.environ['ABI']
          signer = '9235d22df8c6e12a3cbddc2e18aec1ab3e9c2b1abad8f54ee77c19194c03dd41'
          apksigner = sorted((Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          codes = []
          for folder, commit in [('base',os.environ['BASE_COMMIT']),('target',os.environ['TARGET_COMMIT'])]:
              root = Path(folder)
              metadata = json.loads((root/'BUILD_METADATA.json').read_text())
              assert metadata['commit'] == commit
              assert metadata['android_signed'] is True and metadata['synthetic_data_only'] is True
              apk = root/f'Khotwa-{abi}.apk'
              expected = next(x['sha256'] for x in metadata['files'] if x['file'] == apk.name)
              assert hashlib.sha256(apk.read_bytes()).hexdigest() == expected
              with zipfile.ZipFile(apk) as z:
                  assert z.testzip() is None
                  assert f'lib/{abi}/libapp.so' in z.namelist()
              signature = subprocess.run([str(apksigner),'verify','--verbose','--print-certs',str(apk)],check=True,capture_output=True,text=True).stdout
              assert signer in signature and 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
              package = (root/f'PACKAGE-{abi}.txt').read_text()
              assert "name='org.khotwa.khotwa'" in package
              codes.append(int(re.search(r"versionCode='(\d+)'",package)[1]))
          assert codes[1] > codes[0]
          base_hash = {'arm64-v8a':'fcab6db177cb173f85e96f3439c8b5caea4305b63aba47bfb7cf41fe811d15a4','x86_64':'b6270c4a897333b4af78994a67a40222c37a5586882deb73b15f0ebf934b355c'}
          assert hashlib.sha256(Path(f'base/Khotwa-{abi}.apk').read_bytes()).hexdigest() == base_hash[abi]
          PY
      - name: Produce and round-trip the update
        run: |
          mkdir delta
          bsdiff "base/Khotwa-$ABI.apk" "target/Khotwa-$ABI.apk" "delta/Khotwa-$ABI.bsdiff"
          bspatch "base/Khotwa-$ABI.apk" reconstructed.apk "delta/Khotwa-$ABI.bsdiff"
          cmp "target/Khotwa-$ABI.apk" reconstructed.apk
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          abi = os.environ['ABI']
          base = Path(f'base/Khotwa-{abi}.apk')
          target = Path(f'target/Khotwa-{abi}.apk')
          patch = Path(f'delta/Khotwa-{abi}.bsdiff')
          data = {'algorithm':'BSDIFF40','abi':abi,'base_sha256':digest(base),'target_sha256':digest(target),'target_size':target.stat().st_size,'patch_sha256':digest(patch),'target_commit':os.environ['TARGET_COMMIT'],'base_commit':os.environ['BASE_COMMIT'],'signed_apk_bytes_preserved':True,'round_trip_verified':True,'apksigner_reverified':True}
          Path('delta/DELTA.json').write_text(json.dumps(data,indent=2)+'\n')
          for name in ['BUILD_METADATA.json',f'SIGNATURE-{abi}.txt',f'PACKAGE-{abi}.txt']:
              shutil.copyfile(Path('target')/name,Path('delta')/name)
          print(json.dumps({'patch_bytes':patch.stat().st_size,'full_apk_bytes':target.stat().st_size,'target_sha256':digest(target)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-${{ matrix.key }}-update-9f38187-to-9cee95c
          path: delta/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
